name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_release:
        description: 'Skip GitHub Release creation (dev mode)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -------------------------------------------------------------------
  # Build cross-compiled Go binaries and create a GitHub Release
  # -------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA}"
          DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"

          targets=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )

          mkdir -p dist

          for target in "${targets[@]}"; do
            os="${target%/*}"
            arch="${target#*/}"
            output="talosctl-oidc-${os}-${arch}"
            if [ "$os" = "windows" ]; then
              output="${output}.exe"
            fi
            echo "Building ${os}/${arch}..."
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -ldflags="${LDFLAGS}" -o "dist/${output}" .
          done

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*

  # -------------------------------------------------------------------
  # Build and push the Kubernetes server OCI image to GHCR
  # -------------------------------------------------------------------
  server-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dev,enable={{is_default_branch}}

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------
  # Package and push the Helm chart to GHCR OCI
  # Tags: <version>, <major>.<minor>, and latest (on real semver tags only)
  # -------------------------------------------------------------------
  helm-chart:
    runs-on: ubuntu-latest
    needs: server-image
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute chart version and tags
        id: vars
        run: |
          REF="${GITHUB_REF_NAME}"
          # Strip leading 'v' for semver chart version (Helm requires plain semver)
          if [[ "${REF}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            CHART_VERSION="${BASH_REMATCH[1]}"
            APP_VERSION="${REF}"
            IS_RELEASE="true"
          else
            # workflow_dispatch without a tag → dev build
            CHART_VERSION="0.0.0-dev"
            APP_VERSION="dev"
            IS_RELEASE="false"
          fi
          echo "chart_version=${CHART_VERSION}" >> $GITHUB_OUTPUT
          echo "app_version=${APP_VERSION}"     >> $GITHUB_OUTPUT
          echo "is_release=${IS_RELEASE}"       >> $GITHUB_OUTPUT

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Log in to GHCR (Helm)
        run: |
          echo "${{ secrets.CR_PAT }}" | \
            helm registry login ${{ env.REGISTRY }} \
              --username ${{ github.actor }} \
              --password-stdin

      - name: Setup crane
        uses: imjasonh/setup-crane@v0.7

      - name: Package Helm chart
        run: |
          helm package charts/talosctl-oidc/ \
            --version "${{ steps.vars.outputs.chart_version }}" \
            --app-version "${{ steps.vars.outputs.app_version }}"

      - name: Push versioned chart
        run: |
          helm push talosctl-oidc-${{ steps.vars.outputs.chart_version }}.tgz \
            oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

      - name: Re-tag chart as latest
        if: steps.vars.outputs.is_release == 'true'
        run: |
          crane tag \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/talosctl-oidc:${{ steps.vars.outputs.chart_version }} \
            latest
