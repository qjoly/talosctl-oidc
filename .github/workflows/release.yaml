name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_release:
        description: 'Skip GitHub Release creation (dev mode)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TALOS_VERSION: v1.12.4  # Talos version to use for building installer images

jobs:
  # -------------------------------------------------------------------
  # Build cross-compiled Go binaries and create a GitHub Release
  # -------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X main.version=${VERSION}"

          targets=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )

          mkdir -p dist

          for target in "${targets[@]}"; do
            os="${target%/*}"
            arch="${target#*/}"
            output="talosctl-oidc-${os}-${arch}"
            if [ "$os" = "windows" ]; then
              output="${output}.exe"
            fi
            echo "Building ${os}/${arch}..."
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -ldflags="${LDFLAGS}" -o "dist/${output}" .
          done

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*

  # -------------------------------------------------------------------
  # Build and push the Talos extension OCI image to GHCR
  # -------------------------------------------------------------------
  extension-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=dev,enable={{is_default_branch}}

      - name: Debug metadata outputs
        run: |
          echo "Generated tags (for debugging):"
          echo "${{ steps.meta.outputs.tags }}"

      - name: Build and push extension image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: extension
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------
  # Build and push the Talos installer image with the extension baked in
  # -------------------------------------------------------------------
  installer-image:
    runs-on: ubuntu-latest
    needs: extension-image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup crane
        uses: imjasonh/setup-crane@v0.5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-installer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=dev,enable={{is_default_branch}}

      - name: Get extension digest
        id: extension-digest
        run: |
          # Determine the tag to use: semver tag from ref_name, or 'dev' for non-tag runs
          if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="dev"
          fi
          EXTENSION_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "digest=$(crane digest $EXTENSION_IMAGE)" >> $GITHUB_OUTPUT

      - name: Build and push installer image
        run: |
          EXTENSION_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.extension-digest.outputs.tag }}@${{ steps.extension-digest.outputs.digest }}"
          
          docker run --rm -t \
            -v $PWD/_out:/out \
            ghcr.io/siderolabs/imager:${{ env.TALOS_VERSION }} installer \
            --system-extension-image "${EXTENSION_REF}"

          # Push each installer tar to GHCR with proper tags
          for tar in _out/*.tar; do
            [ -f "$tar" ] || continue
            # Use first tag from metadata output (the version tag)
            FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
            echo "Pushing $tar to $FIRST_TAG"
            crane push "$tar" "$FIRST_TAG"
          done
