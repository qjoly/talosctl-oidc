name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TALOS_VERSION: v1.12.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  # -------------------------------------------------------------------
  # Build and push the extension image with pr-<number> tag
  # -------------------------------------------------------------------
  extension-image:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: build
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute PR tag
        id: tag
        run: echo "tag=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Update manifest version
        run: |
          sed -i "s/APP_VERSION/${{ steps.tag.outputs.tag }}/g" manifest.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push extension image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: extension
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-talos-ext:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------
  # Build and push the Kubernetes server image with pr-<number> tag
  # -------------------------------------------------------------------
  server-image:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: build
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute PR tag
        id: tag
        run: echo "tag=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-server:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------
  # Build and push the Talos installer image with pr-<number> tag
  # -------------------------------------------------------------------
  installer-image:
    runs-on: ubuntu-latest
    needs: extension-image
    outputs:
      tag: ${{ needs.extension-image.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup crane
        uses: imjasonh/setup-crane@v0.5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get extension digest
        id: extension-digest
        run: |
          EXTENSION_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-talos-ext:${{ needs.extension-image.outputs.tag }}"
          DIGEST=$(crane digest "${EXTENSION_IMAGE}" 2>/dev/null || true)
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Build and push installer image
        run: |
          TAG="${{ needs.extension-image.outputs.tag }}"
          DIGEST="${{ steps.extension-digest.outputs.digest }}"
          
          if [ -n "${DIGEST}" ]; then
            EXTENSION_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-talos-ext:${TAG}@${DIGEST}"
          else
            EXTENSION_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-talos-ext:${TAG}"
          fi
          
          echo "Using extension reference: ${EXTENSION_REF}"
          INSTALLER_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-installer:${TAG}"

          docker run --rm -t \
            -v $PWD/_out:/out \
            ghcr.io/siderolabs/imager:${{ env.TALOS_VERSION }} installer \
            --system-extension-image "${EXTENSION_REF}"

          for tar in _out/*.tar; do
            [ -f "$tar" ] || continue
            echo "Pushing $tar to $INSTALLER_IMAGE"
            crane push "$tar" "$INSTALLER_IMAGE"
          done

  # -------------------------------------------------------------------
  # Package and push the Helm chart to GHCR OCI with pr-<number> tag
  # -------------------------------------------------------------------
  helm-chart:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute PR tag
        id: tag
        run: echo "tag=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR (Helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ${{ env.REGISTRY }} \
              --username ${{ github.actor }} \
              --password-stdin

      - name: Package and push Helm chart
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # Override chart version and appVersion with the PR tag
          helm package charts/talosctl-oidc/ \
            --version "0.0.0-${TAG}" \
            --app-version "${TAG}"
          helm push talosctl-oidc-0.0.0-${TAG}.tgz \
            oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

  # -------------------------------------------------------------------
  # Post a comment on the PR with testing instructions
  # -------------------------------------------------------------------
  pr-comment:
    runs-on: ubuntu-latest
    needs: [installer-image, helm-chart, server-image]
    steps:
      - name: Find existing comment
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "## Testing this PR"

      - name: Post or update PR comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## Testing this PR

            Images for this PR have been built and pushed:

            | Image | Tag |
            |-------|-----|
            | Extension | `ghcr.io/${{ github.repository }}-talos-ext:${{ needs.installer-image.outputs.tag }}` |
            | Server (Kubernetes) | `ghcr.io/${{ github.repository }}-server:${{ needs.installer-image.outputs.tag }}` |
            | Installer | `ghcr.io/${{ github.repository }}-installer:${{ needs.installer-image.outputs.tag }}` |
            | Helm chart | `oci://ghcr.io/${{ github.repository_owner }}/charts/talosctl-oidc:0.0.0-${{ needs.installer-image.outputs.tag }}` |

            ### Upgrade a Talos node with this PR

            ```bash
            talosctl upgrade --image ghcr.io/${{ github.repository }}-installer:${{ needs.installer-image.outputs.tag }}
            ```

            ### Deploy on Kubernetes with Helm

            ```bash
            helm install talosctl-oidc \
              oci://ghcr.io/${{ github.repository_owner }}/charts/talosctl-oidc \
              --version 0.0.0-${{ needs.installer-image.outputs.tag }} \
              --namespace talos-system --create-namespace \
              --set talos.apiAccess.enabled=false \
              --set-string "talos.caCertData=$(cat talos-ca.crt)" \
              --set-string "talos.caKeyData=$(cat talos-ca.key)" \
              --set config.issuerUrl=https://your-oidc-provider/ \
              --set config.clientId=your-client-id \
              --set "config.endpoints={10.0.0.1}"
            ```

            ### Run the server locally (from binary)

            ```bash
            # Build from this branch
            git checkout ${{ github.head_ref }}
            go build -o talosctl-oidc .

            # Start the server
            TALOSCTL_OIDC_CA_CERT=talos-ca.crt \
            TALOSCTL_OIDC_CA_KEY=talos-ca.key \
            TALOSCTL_OIDC_ISSUER_URL=https://your-oidc-provider/.well-known/openid-configuration \
            TALOSCTL_OIDC_CLIENT_ID=your-client-id \
            TALOSCTL_OIDC_ENDPOINTS=10.0.0.1 \
            TALOSCTL_OIDC_LISTEN=:8443 \
            ./talosctl-oidc serve
            ```

            ### Login

            ```bash
            ./talosctl-oidc login \
              --provider https://your-oidc-provider/ \
              --client-id your-client-id \
              --server https://localhost:8443 \
              --server-ca server-ca.pem \
              --context-name oidc
            ```

            ### Verify

            ```bash
            talosctl --context oidc version
            ```

            ---
            *Built from ${{ github.event.pull_request.head.sha }}*

