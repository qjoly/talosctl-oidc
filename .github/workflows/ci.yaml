name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TALOS_VERSION: v1.12.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.10.1

  # -------------------------------------------------------------------
  # Integration test: full OIDC flow with Dex + certificate exchange
  # -------------------------------------------------------------------
  integration-test:
    runs-on: ubuntu-latest
    needs: build
    env:
      DEX_PORT: "5556"
      SERVER_PORT: "8080"
      CALLBACK_PORT: "8900"
      CLIENT_ID: "talosctl-oidc"
      DEX_CONTAINER_NAME: "talosctl-oidc-dex"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build binary
        run: go build -o talosctl-oidc .

      - name: Generate test CA
        run: |
          mkdir -p test-env
          openssl genrsa -out test-env/ca.key 4096 2>/dev/null
          openssl req -new -x509 \
            -key test-env/ca.key \
            -out test-env/ca.crt \
            -days 365 \
            -subj "/CN=Test Talos CA/O=Test" \
            2>/dev/null

      - name: Write Dex configuration
        run: |
          mkdir -p test-env/dex
          PASSWORD_HASH='$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W'
          cat > test-env/dex/config.yaml << DEXEOF
          issuer: http://localhost:${DEX_PORT}/dex
          storage:
            type: memory
          web:
            http: 0.0.0.0:${DEX_PORT}
          logger:
            level: info
          oauth2:
            skipApprovalScreen: true
            responseTypes:
              - code
          staticClients:
            - id: ${CLIENT_ID}
              name: talosctl-oidc
              public: true
              redirectURIs:
                - http://localhost:${CALLBACK_PORT}/callback
                - http://127.0.0.1:${CALLBACK_PORT}/callback
          enablePasswordDB: true
          staticPasswords:
            - email: "admin@example.com"
              hash: "${PASSWORD_HASH}"
              username: "admin"
              userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
          DEXEOF

      - name: Start Dex
        run: |
          docker run -d \
            --name "$DEX_CONTAINER_NAME" \
            -p "${DEX_PORT}:${DEX_PORT}" \
            -v "$(pwd)/test-env/dex:/dex-config:ro" \
            dexidp/dex:v2.45.1 \
            dex serve /dex-config/config.yaml

          echo "Waiting for Dex to become healthy..."
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:${DEX_PORT}/dex/.well-known/openid-configuration" >/dev/null 2>&1; then
              echo "Dex is ready"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Dex did not become healthy within 60s"
              docker logs "$DEX_CONTAINER_NAME"
              exit 1
            fi
            sleep 1
          done

      - name: Write server configuration
        run: |
          mkdir -p test-env/server-data
          cat > test-env/server-config.yaml << SRVEOF
          issuer_url: http://localhost:${DEX_PORT}/dex
          client_id: ${CLIENT_ID}
          ca_cert: $(pwd)/test-env/ca.crt
          ca_key: $(pwd)/test-env/ca.key
          listen: ":${SERVER_PORT}"
          endpoints:
            - localhost
          cert_ttl: "5m"
          roles:
            - os:admin
          insecure: true
          data_dir: $(pwd)/test-env/server-data
          audit_log: $(pwd)/test-env/audit.log
          SRVEOF

      - name: Start talosctl-oidc server
        run: |
          ./talosctl-oidc serve --config test-env/server-config.yaml &
          echo $! > test-env/server.pid

          echo "Waiting for server to become healthy..."
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:${SERVER_PORT}/healthz" >/dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server did not become healthy within 30s"
              exit 1
            fi
            sleep 1
          done

      - name: Run OIDC login flow and certificate exchange
        run: |
          set -euo pipefail

          COOKIE_JAR=$(mktemp)
          REDIRECT_URI="http://localhost:${CALLBACK_PORT}/callback"

          # ── Step 1: Generate PKCE code verifier and challenge ──
          CODE_VERIFIER=$(openssl rand -base64 32 | tr -d '=+/' | head -c 43)
          CODE_CHALLENGE=$(printf '%s' "$CODE_VERIFIER" | openssl dgst -sha256 -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          STATE=$(openssl rand -hex 16)

          echo "==> Starting OIDC Authorization Code flow with PKCE"

          # ── Step 2: Hit the authorization endpoint, follow redirects to login page ──
          AUTH_URL="http://localhost:${DEX_PORT}/dex/auth?response_type=code&client_id=${CLIENT_ID}&redirect_uri=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${REDIRECT_URI}'))")&scope=openid+profile+email+offline_access&state=${STATE}&code_challenge=${CODE_CHALLENGE}&code_challenge_method=S256"

          echo "==> Requesting authorization endpoint"
          LOGIN_PAGE=$(curl -s -c "$COOKIE_JAR" -b "$COOKIE_JAR" -L "$AUTH_URL" -D - -o /dev/null -w '%{url_effective}')

          # Follow the redirect to get the login page and extract the form action URL
          LOGIN_RESPONSE=$(curl -s -c "$COOKIE_JAR" -b "$COOKIE_JAR" -L "$AUTH_URL")
          
          # Extract the form action URL (contains state/back parameters)
          FORM_ACTION=$(echo "$LOGIN_RESPONSE" | grep -oP 'action="\K[^"]+' | head -1 || true)
          
          if [ -z "$FORM_ACTION" ]; then
            echo "ERROR: Could not extract form action from Dex login page"
            echo "Login page content:"
            echo "$LOGIN_RESPONSE" | head -50
            exit 1
          fi
          
          # Convert HTML entities (&amp; -> &)
          FORM_ACTION=$(echo "$FORM_ACTION" | sed 's/&amp;/\&/g')
          echo "==> Extracted form action: ${FORM_ACTION}"

          # ── Step 3: Submit login credentials to Dex ──
          echo "==> Submitting credentials to Dex"
          LOGIN_RESULT=$(curl -s -c "$COOKIE_JAR" -b "$COOKIE_JAR" \
            -X POST \
            -d "login=admin@example.com&password=password" \
            -D /dev/stderr \
            -o /dev/null \
            -w '%{redirect_url}' \
            "http://localhost:${DEX_PORT}${FORM_ACTION}" 2>/tmp/login_headers)

          echo "==> Login redirect URL: ${LOGIN_RESULT}"

          # ── Step 4: Follow the approval redirect chain to get the callback URL ──
          # Dex will redirect through /approval -> callback URL with the auth code.
          # We DON'T follow the final redirect (to localhost:8900) since nothing is listening there.
          CALLBACK_URL=$(curl -s -c "$COOKIE_JAR" -b "$COOKIE_JAR" \
            -L --max-redirs 5 \
            -D /dev/stderr \
            -o /dev/null \
            -w '%{url_effective}' \
            "$LOGIN_RESULT" 2>/tmp/redirect_headers || true)

          # If curl failed because nothing listens on the callback port, extract the Location from headers
          if ! echo "$CALLBACK_URL" | grep -q "code="; then
            CALLBACK_URL=$(grep -i '^location:' /tmp/redirect_headers | tail -1 | tr -d '\r' | sed 's/^[Ll]ocation: //')
          fi

          # If still no code, try without following the final redirect
          if ! echo "$CALLBACK_URL" | grep -q "code="; then
            CALLBACK_URL=$(curl -s -c "$COOKIE_JAR" -b "$COOKIE_JAR" \
              -D /dev/stderr \
              -o /dev/null \
              -w '%{redirect_url}' \
              "$LOGIN_RESULT" 2>/tmp/approval_headers)
            
            # The approval endpoint redirects to the callback
            if ! echo "$CALLBACK_URL" | grep -q "code="; then
              CALLBACK_URL=$(grep -i '^location:' /tmp/approval_headers | tail -1 | tr -d '\r' | sed 's/^[Ll]ocation: //')
            fi
          fi

          echo "==> Callback URL: ${CALLBACK_URL}"

          # Extract authorization code from the callback URL
          AUTH_CODE=$(echo "$CALLBACK_URL" | grep -oP 'code=\K[^&]+')
          RETURNED_STATE=$(echo "$CALLBACK_URL" | grep -oP 'state=\K[^&]+')

          if [ -z "$AUTH_CODE" ]; then
            echo "ERROR: Could not extract authorization code from callback URL"
            echo "Headers from redirects:"
            cat /tmp/redirect_headers 2>/dev/null || true
            cat /tmp/approval_headers 2>/dev/null || true
            exit 1
          fi

          echo "==> Got authorization code: ${AUTH_CODE:0:20}..."

          # Verify state parameter
          if [ "$RETURNED_STATE" != "$STATE" ]; then
            echo "ERROR: State mismatch! Expected: ${STATE}, Got: ${RETURNED_STATE}"
            exit 1
          fi
          echo "==> State parameter verified"

          # ── Step 5: Exchange authorization code for tokens ──
          echo "==> Exchanging authorization code for tokens"
          TOKEN_RESPONSE=$(curl -s -X POST "http://localhost:${DEX_PORT}/dex/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=authorization_code&code=${AUTH_CODE}&redirect_uri=${REDIRECT_URI}&client_id=${CLIENT_ID}&code_verifier=${CODE_VERIFIER}")

          ID_TOKEN=$(echo "$TOKEN_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id_token',''))" 2>/dev/null)

          if [ -z "$ID_TOKEN" ]; then
            echo "ERROR: Could not extract id_token from token response"
            echo "Token response: ${TOKEN_RESPONSE}"
            exit 1
          fi
          echo "==> Got ID token (${#ID_TOKEN} chars)"

          # ── Step 6: Exchange ID token for certificate via talosctl-oidc server ──
          echo "==> Exchanging ID token for certificate"
          EXCHANGE_RESPONSE=$(curl -s -X POST "http://localhost:${SERVER_PORT}/exchange" \
            -H "Content-Type: application/json" \
            -d "{\"id_token\": \"${ID_TOKEN}\"}" \
            -w "\n%{http_code}" )

          HTTP_CODE=$(echo "$EXCHANGE_RESPONSE" | tail -1)
          EXCHANGE_BODY=$(echo "$EXCHANGE_RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Certificate exchange failed with HTTP ${HTTP_CODE}"
            echo "Response: ${EXCHANGE_BODY}"
            exit 1
          fi

          echo "==> Certificate exchange succeeded (HTTP ${HTTP_CODE})"

          # ── Step 7: Validate response contains expected fields ──
          echo "==> Validating certificate response..."

          for field in ca cert key endpoints ttl_seconds; do
            if ! echo "$EXCHANGE_BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); assert '${field}' in d and d['${field}'], '${field} missing or empty'" 2>/dev/null; then
              echo "ERROR: Response missing or empty field: ${field}"
              echo "Response: ${EXCHANGE_BODY}"
              exit 1
            fi
          done
          echo "==> All expected fields present in response"

          # Validate the returned certificate is parseable
          CERT_PEM=$(echo "$EXCHANGE_BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['cert'])")
          echo "$CERT_PEM" | openssl x509 -noout -text > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "ERROR: Returned certificate is not valid PEM"
            exit 1
          fi
          echo "==> Returned certificate is valid X.509"

          # Verify the certificate is signed by our test CA
          echo "$CERT_PEM" > /tmp/client-cert.pem
          if openssl verify -CAfile test-env/ca.crt /tmp/client-cert.pem >/dev/null 2>&1; then
            echo "==> Certificate correctly signed by test CA"
          else
            echo "ERROR: Certificate is NOT signed by the test CA"
            exit 1
          fi

          # Check the certificate has the expected organization (role)
          CERT_ORG=$(echo "$CERT_PEM" | openssl x509 -noout -subject | grep -oP 'O = \K[^,/]+' || true)
          echo "==> Certificate organization (role): ${CERT_ORG}"

          # Check TTL
          TTL=$(echo "$EXCHANGE_BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['ttl_seconds'])")
          echo "==> Certificate TTL: ${TTL}s"

          ENDPOINTS=$(echo "$EXCHANGE_BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['endpoints'])")
          echo "==> Endpoints: ${ENDPOINTS}"

          echo ""
          echo "=== Integration test PASSED ==="

          # Cleanup
          rm -f "$COOKIE_JAR" /tmp/login_headers /tmp/redirect_headers /tmp/approval_headers /tmp/client-cert.pem

      - name: Check server audit log
        if: always()
        run: |
          if [ -f test-env/audit.log ]; then
            echo "==> Audit log contents:"
            cat test-env/audit.log
          else
            echo "No audit log found"
          fi

      - name: Cleanup
        if: always()
        run: |
          # Stop the server
          if [ -f test-env/server.pid ]; then
            kill "$(cat test-env/server.pid)" 2>/dev/null || true
          fi
          # Remove the Dex container
          docker rm -f "$DEX_CONTAINER_NAME" 2>/dev/null || true

  # -------------------------------------------------------------------
  # Build and push the extension image with pr-<number> tag
  # -------------------------------------------------------------------
  extension-image:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [build, lint]
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute PR tag
        id: tag
        run: echo "tag=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Update manifest version
        run: |
          sed -i "s/APP_VERSION/${{ steps.tag.outputs.tag }}/g" manifest.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push extension image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: extension
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-talos-ext:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------
  # Build and push the Kubernetes server image with pr-<number> tag
  # -------------------------------------------------------------------
  server-image:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [build, lint]
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute PR tag
        id: tag
        run: echo "tag=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-server:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------
  # Build and push the Talos installer image with pr-<number> tag
  # -------------------------------------------------------------------
  installer-image:
    runs-on: ubuntu-latest
    needs: extension-image
    outputs:
      tag: ${{ needs.extension-image.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup crane
        uses: imjasonh/setup-crane@v0.5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get extension digest
        id: extension-digest
        run: |
          EXTENSION_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-talos-ext:${{ needs.extension-image.outputs.tag }}"
          DIGEST=$(crane digest "${EXTENSION_IMAGE}" 2>/dev/null || true)
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Build and push installer image
        run: |
          TAG="${{ needs.extension-image.outputs.tag }}"
          DIGEST="${{ steps.extension-digest.outputs.digest }}"

          if [ -n "${DIGEST}" ]; then
            EXTENSION_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-talos-ext:${TAG}@${DIGEST}"
          else
            EXTENSION_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-talos-ext:${TAG}"
          fi

          echo "Using extension reference: ${EXTENSION_REF}"
          INSTALLER_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-installer:${TAG}"

          docker run --rm -t \
            -v $PWD/_out:/out \
            ghcr.io/siderolabs/imager:${{ env.TALOS_VERSION }} installer \
            --system-extension-image "${EXTENSION_REF}"

          for tar in _out/*.tar; do
            [ -f "$tar" ] || continue
            echo "Pushing $tar to $INSTALLER_IMAGE"
            crane push "$tar" "$INSTALLER_IMAGE"
          done

  # -------------------------------------------------------------------
  # Package and push the Helm chart to GHCR OCI with pr-<number> tag
  # -------------------------------------------------------------------
  helm-chart:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [build, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute PR tag
        id: tag
        run: echo "tag=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR (Helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ${{ env.REGISTRY }} \
              --username ${{ github.actor }} \
              --password-stdin

      - name: Package and push Helm chart
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # Override chart version and appVersion with the PR tag
          helm package charts/talosctl-oidc/ \
            --version "0.0.0-${TAG}" \
            --app-version "${TAG}"
          helm push talosctl-oidc-0.0.0-${TAG}.tgz \
            oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

  # -------------------------------------------------------------------
  # Post a comment on the PR with testing instructions
  # -------------------------------------------------------------------
  pr-comment:
    runs-on: ubuntu-latest
    needs: [installer-image, helm-chart, server-image]
    steps:
      - name: Find existing comment
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "## Testing this PR"

      - name: Post or update PR comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## Testing this PR

            Images for this PR have been built and pushed:

            | Image | Tag |
            |-------|-----|
            | Extension | `ghcr.io/${{ github.repository }}-talos-ext:${{ needs.installer-image.outputs.tag }}` |
            | Server (Kubernetes) | `ghcr.io/${{ github.repository }}-server:${{ needs.installer-image.outputs.tag }}` |
            | Installer | `ghcr.io/${{ github.repository }}-installer:${{ needs.installer-image.outputs.tag }}` |
            | Helm chart | `oci://ghcr.io/${{ github.repository_owner }}/charts/talosctl-oidc:0.0.0-${{ needs.installer-image.outputs.tag }}` |

            ### Upgrade a Talos node with this PR

            ```bash
            talosctl upgrade --image ghcr.io/${{ github.repository }}-installer:${{ needs.installer-image.outputs.tag }}
            ```

            ### Deploy on Kubernetes with Helm

            ```bash
            helm install talosctl-oidc \
              oci://ghcr.io/${{ github.repository_owner }}/charts/talosctl-oidc \
              --version 0.0.0-${{ needs.installer-image.outputs.tag }} \
              --namespace talos-system --create-namespace \
              --set talos.apiAccess.enabled=false \
              --set-string "talos.caCertData=$(cat talos-ca.crt)" \
              --set-string "talos.caKeyData=$(cat talos-ca.key)" \
              --set config.issuerUrl=https://your-oidc-provider/ \
              --set config.clientId=your-client-id \
              --set "config.endpoints={10.0.0.1}"
            ```

            ### Run the server locally (from binary)

            ```bash
            # Build from this branch
            git checkout ${{ github.head_ref }}
            go build -o talosctl-oidc .

            # Start the server
            TALOSCTL_OIDC_CA_CERT=talos-ca.crt \
            TALOSCTL_OIDC_CA_KEY=talos-ca.key \
            TALOSCTL_OIDC_ISSUER_URL=https://your-oidc-provider/.well-known/openid-configuration \
            TALOSCTL_OIDC_CLIENT_ID=your-client-id \
            TALOSCTL_OIDC_ENDPOINTS=10.0.0.1 \
            TALOSCTL_OIDC_LISTEN=:8443 \
            ./talosctl-oidc serve
            ```

            ### Login

            ```bash
            ./talosctl-oidc login \
              --provider https://your-oidc-provider/ \
              --client-id your-client-id \
              --server https://localhost:8443 \
              --server-ca server-ca.pem \
              --context-name oidc
            ```

            ### Verify

            ```bash
            talosctl --context oidc version
            ```

            ---
            *Built from ${{ github.event.pull_request.head.sha }}*
