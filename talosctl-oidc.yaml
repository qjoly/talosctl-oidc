name: talosctl-oidc
container:
  entrypoint: ./talosctl-oidc
  args:
    - serve
  mounts:
    # TLS root certificates for OIDC provider HTTPS validation
    - source: /etc/ssl/certs
      destination: /etc/ssl/certs
      type: bind
      options:
        - rbind
        - ro
depends:
  - network:
      - addresses
      - connectivity
      - etcfiles
  - configuration: true
restart: always
