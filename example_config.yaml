issuer_url: https://oidc.home.une-tasse-de.cafe/application/o/talos-oidc/
client_id: talosctl_oidc # Required

# Talos Configuration
#
# Certificates are issued via the Talos API (GenerateClientConfiguration), so
# this server never holds the CA private key and the roles it can grant are
# bounded by its own credential. In-cluster, leave talos_config empty to use the
# credential provisioned by the talos.dev ServiceAccount
# (machine.features.kubernetesTalosAPIAccess). Set it only to point at an
# explicit talosconfig.
# talos_config: /var/run/secrets/talos.dev/config

rate_limit_requests: 10
rate_limit_window: "1m"

ip_allowlist:
  - 192.168.1.0/24
  - 10.0.0.50
  - ::1
  - 127.0.0.1

# Network Configuration
listen: ":8443"
endpoints:
  - 192.168.0.42

# Certificate Settings
# Short TTL is the primary revocation compensating control (ISO 27001 A.9.2.6 / SEC-3).
# Pair with --watch on the client for seamless auto-renewal.
cert_ttl: "5m"

# Static roles (used as fallback when RBAC is disabled or no rules match)
roles: []

# RBAC Configuration - Dynamic role mapping based on OIDC claims
# When RBAC is configured, roles are assigned based on OIDC token claims
# instead of using the static 'roles' list above.
#
# Example: Map OIDC groups to Talos roles
# - Users in 'platform-admins' group get 'os:admin' role
# - Users in 'developers' group get 'os:reader' role
# - Users matching no rules get the default roles from the 'roles' list
rbac:
  rules:
    - claim: groups
      value: platform-admins
      roles:
        - os:admin
    - claim: groups
      value: Tech
      roles:
        - os:reader
    - claim: groups
      value: auditors
      roles:
        - os:reader

# TLS Configuration
# tls_cert: temp/tls.crt
# tls_key: temp/tls.key
# or use insecure mode (not recommended for production)
insecure: true

# Persistence
data_dir: ./temp/talosctl-oidc

# Logging & Admin
audit_log: ./temp/audit.log
admin_token: my-secret-admin-token
