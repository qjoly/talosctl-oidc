apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "talosctl-oidc.fullname" . }}
  labels:
    {{- include "talosctl-oidc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "talosctl-oidc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "talosctl-oidc.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "talosctl-oidc.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.image.command }}
          command:
            {{- toYaml .Values.image.command | nindent 12 }}
          {{- else }}
          command: ["/talosctl-oidc"]
          {{- end }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8443
              protocol: TCP
          env:
            - name: TALOSCTL_OIDC_INSECURE
              value: {{ if or .Values.config.insecure (and .Values.ingress.enabled .Values.ingress.tls) }}"true"{{ else }}"false"{{ end }}
            {{- if and .Values.talos.caCertData .Values.talos.caKeyData }}
            # Inline PEM mode: CA content is injected directly via environment variables.
            - name: TALOSCTL_OIDC_CA_CERT_DATA
              valueFrom:
                secretKeyRef:
                  name: {{ include "talosctl-oidc.fullname" . }}-ca-data
                  key: ca.crt
            - name: TALOSCTL_OIDC_CA_KEY_DATA
              valueFrom:
                secretKeyRef:
                  name: {{ include "talosctl-oidc.fullname" . }}-ca-data
                  key: ca.key
            {{- else }}
            - name: TALOSCTL_OIDC_CA_CERT
              value: "/etc/talos/{{ .Values.talos.caSecretKeys.cert }}"
            - name: TALOSCTL_OIDC_CA_KEY
              value: "/etc/talos/{{ .Values.talos.caSecretKeys.key }}"
            {{- end }}
            - name: TALOSCTL_OIDC_ISSUER_URL
              value: {{ .Values.config.issuerUrl | quote }}
            - name: TALOSCTL_OIDC_CLIENT_ID
              value: {{ .Values.config.clientId | quote }}
            {{- if .Values.config.existingSecret }}
            - name: TALOSCTL_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.existingSecret }}
                  key: client-secret
                  optional: true
            {{- else if .Values.config.clientSecret }}
            - name: TALOSCTL_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "talosctl-oidc.fullname" . }}-config
                  key: client-secret
            {{- end }}
            - name: TALOSCTL_OIDC_ENDPOINTS
              value: {{ join "," .Values.config.endpoints | quote }}
            - name: TALOSCTL_OIDC_ROLES
              value: {{ join "," .Values.config.roles | quote }}
            - name: TALOSCTL_OIDC_CERT_TTL
              value: {{ .Values.config.certTTL | quote }}
            {{- if .Values.config.existingSecret }}
            - name: TALOSCTL_OIDC_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.existingSecret }}
                  key: admin-token
                  optional: true
            {{- else if .Values.config.adminToken }}
            - name: TALOSCTL_OIDC_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "talosctl-oidc.fullname" . }}-config
                  key: admin-token
            {{- end }}
            - name: TALOSCTL_OIDC_AUDIT_LOG
              value: {{ .Values.config.auditLog | quote }}
            - name: TALOSCTL_OIDC_LISTEN
              value: ":8443"
            {{- if .Values.config.rateLimitRequests }}
            - name: TALOSCTL_OIDC_RATE_LIMIT_REQUESTS
              value: {{ .Values.config.rateLimitRequests | quote }}
            - name: TALOSCTL_OIDC_RATE_LIMIT_WINDOW
              value: {{ .Values.config.rateLimitWindow | quote }}
            {{- end }}
            {{- if .Values.config.ipAllowlist }}
            - name: TALOSCTL_OIDC_IP_ALLOWLIST
              value: {{ join "," .Values.config.ipAllowlist | quote }}
            {{- end }}
          volumeMounts:
            {{- if not (and .Values.talos.caCertData .Values.talos.caKeyData) }}
            - name: talos-ca
              mountPath: "/etc/talos"
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if not (and .Values.talos.caCertData .Values.talos.caKeyData) }}
        - name: talos-ca
          secret:
            secretName: {{ default (printf "%s-ca" (include "talosctl-oidc.fullname" .)) .Values.talos.caSecretName }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
