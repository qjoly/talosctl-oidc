{{- if and .Values.talos.apiAccess.enabled (not .Values.talos.existingCredentialSecret) }}
# Provisions a short-lived Talos API credential via the "Kubernetes Talos API
# access" feature. Talos watches this resource and creates a Secret of the same
# name containing a "config" key (talosconfig), which the Deployment mounts.
# Requires machine.features.kubernetesTalosAPIAccess to be enabled on the nodes,
# with this namespace in allowedKubernetesNamespaces and these roles allowed.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: {{ include "talosctl-oidc.fullname" . }}-talos
  labels:
    {{- include "talosctl-oidc.labels" . | nindent 4 }}
spec:
  roles:
    {{- toYaml .Values.talos.apiAccess.roles | nindent 4 }}
{{- end }}
