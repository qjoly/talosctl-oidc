{{- if .Values.talos.apiAccess.enabled }}
---
# Talos ServiceAccount — instructs Talos to provision a Kubernetes Secret containing
# the cluster OS CA certificate and key, mounted into the pod at:
#   /var/run/secrets/talos.dev/os.crt
#   /var/run/secrets/talos.dev/os.key
#
# Requires the kubernetesTalosAPIAccess feature to be enabled in the machine config:
#   machine:
#     features:
#       kubernetesTalosAPIAccess:
#         enabled: true
#         allowedRoles:
#           - os:admin          # must cover the roles requested below
#         allowedKubernetesNamespaces:
#           - <this namespace>
#
# See: https://docs.siderolabs.com/kubernetes-guides/advanced-guides/talos-api-access-from-k8s/
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: {{ include "talosctl-oidc.fullname" . }}-talos-secrets
  labels:
    {{- include "talosctl-oidc.labels" . | nindent 4 }}
spec:
  roles:
    {{- toYaml .Values.talos.apiAccess.roles | nindent 4 }}
{{- end }}
