# Default values for talosctl-oidc.

image:
  # The server image is a standard scratch image with the binary at /talosctl-oidc
  # and the system CA bundle at /etc/ssl/certs/ca-certificates.crt.
  # It is suitable for running as a Kubernetes Deployment.
  repository: ghcr.io/qjoly/talosctl-oidc-server
  pullPolicy: Always
  tag: "latest"
  # Binary path in the server image:
  command: ["/talosctl-oidc"]

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8443
  targetPort: 8443

ingress:
  enabled: false
  className: ""
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

  # Enable SSL passthrough, so the ingress controller forwards the encrypted
  # stream and the pod terminates TLS itself. Use this when clients must verify
  # the server certificate end to end (for example `talosctl-oidc login
  # --server-ca`), because with normal termination the client only ever sees the
  # ingress controller's certificate.
  #
  # Three things are required for this to work:
  #   1. The controller must have passthrough enabled globally
  #      (ingress-nginx: --enable-ssl-passthrough).
  #   2. The matching annotation must be set under ingress.annotations; the name
  #      is controller-specific, so the chart cannot infer it:
  #        ingress-nginx  nginx.ingress.kubernetes.io/ssl-passthrough: "true"
  #        Traefik        traefik.ingress.kubernetes.io/router.tls.passthrough: "true"
  #        HAProxy        haproxy.org/ssl-passthrough: "true"
  #   3. The pod needs a certificate clients trust for the ingress host — set
  #      tls.certManager.enabled or tls.existingSecret below. The default
  #      self-signed certificate works only if clients pass --server-ca.
  #
  # When true, ingress.tls is left out of the rendered Ingress and the pod is
  # never switched to plain HTTP.
  sslPassthrough: false

resources:
  {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Extra volumes to add to the pod.
# Example:
#   extraVolumes:
#     - name: my-config
#       configMap:
#         name: my-configmap
extraVolumes: []

# Extra volume mounts to add to the talosctl-oidc container.
# Example:
#   extraVolumeMounts:
#     - name: my-config
#       mountPath: /etc/my-config
#       readOnly: true
extraVolumeMounts: []

# Server TLS
#
# By default the server generates a self-signed certificate at startup, and
# clients must be given the CA (talosctl-oidc login --server-ca). The options
# below let the pod serve a real certificate instead.
#
# When either source is configured the chart mounts the Secret, points
# TALOSCTL_OIDC_TLS_CERT/KEY at it, and never switches the pod to plain HTTP.
# The server re-reads the keypair when it changes, so renewals do not need a
# pod restart.
tls:
  # Use an existing Secret containing tls.crt and tls.key. Takes precedence over
  # certManager below.
  existingSecret: ""

  # Where the keypair is mounted in the container.
  mountPath: /tls

  certManager:
    # Create a cert-manager Certificate resource. Requires cert-manager to be
    # installed in the cluster: the chart does not check for the CRD, so that
    # `helm template` and GitOps rendering keep working without cluster access.
    enabled: false

    # Name of the Issuer or ClusterIssuer to use. Required when enabled.
    issuerName: ""

    # "Issuer" (same namespace) or "ClusterIssuer" (cluster-wide).
    issuerKind: ClusterIssuer

    # Optional CommonName override. Leave empty to rely on dnsNames, which is
    # what modern clients actually validate.
    commonName: ""

    # DNS SANs. When empty the chart derives them from how the server is
    # reached: the ingress hosts if ingress.enabled, otherwise the in-cluster
    # Service names (<name>, <name>.<ns>, <name>.<ns>.svc and
    # <name>.<ns>.svc.cluster.local).
    #
    # The two sets are deliberately not merged: a public ACME issuer such as
    # Let's Encrypt cannot validate a .svc.cluster.local name and would refuse
    # the whole certificate. Set this explicitly to cover both.
    dnsNames: []

    # Certificate lifetime and how long before expiry cert-manager renews it.
    duration: "2160h" # 90 days
    renewBefore: "360h" # 15 days

    # Optional cert-manager privateKey block, e.g. to pick an algorithm or to
    # rotate the key on renewal:
    #   privateKey:
    #     algorithm: ECDSA
    #     size: 256
    #     rotationPolicy: Always
    privateKey: {}

# Application Configuration
config:
  # TALOSCTL_OIDC_INSECURE
  # If true, the server listens on HTTP.
  # If false, the server listens on HTTPS (using provided certs or self-signed).
  # If ingress is enabled with TLS, this should likely be true.
  insecure: false

  # TALOSCTL_OIDC_ISSUER_URL (Required)
  # Example: "https://your-issuer.example.com/application/o/talos-oidc"
  issuerUrl: ""

  # TALOSCTL_OIDC_CLIENT_ID (Required)
  # Example: "your-client-id"
  clientId: ""

  # TALOSCTL_OIDC_CLIENT_SECRET (Optional)
  clientSecret: ""

  # Use an existing secret for clientSecret and adminToken
  # keys must be 'client-secret' and 'admin-token'
  existingSecret: ""

  # TALOSCTL_OIDC_ENDPOINTS (Required)
  # List of Talos node endpoints
  # Example:
  #   endpoints:
  #     - 10.0.0.1
  endpoints: []

  # TALOSCTL_OIDC_ROLES
  roles:
    - "os:admin"

  # TALOSCTL_OIDC_CERT_TTL
  # Short TTL is the primary revocation compensating control (ISO 27001 A.9.2.6).
  # Pair with --watch on the client for seamless auto-renewal.
  # Recommended range: 5m–10m. Lower values reduce exposure but increase exchange frequency.
  certTTL: "5m"

  # TALOSCTL_OIDC_ADMIN_TOKEN (Optional)
  adminToken: ""

  # TALOSCTL_OIDC_AUDIT_LOG
  auditLog: "-"

  # Rate limiting configuration
  # TALOSCTL_OIDC_RATE_LIMIT_REQUESTS: requests per window (0 = disabled)
  # TALOSCTL_OIDC_RATE_LIMIT_WINDOW: rate limit window duration (e.g., "1m", "5m", "1h")
  rateLimitRequests: 0
  rateLimitWindow: "1m"

  # IP allowlist configuration
  # TALOSCTL_OIDC_IP_ALLOWLIST: comma-separated list of allowed IPs/CIDRs
  # Example:
  #   ipAllowlist:
  #     - 192.168.1.0/24
  #     - 10.0.0.50
  ipAllowlist: []

# Talos API access
#
# The server issues certificates by calling the Talos API
# (GenerateClientConfiguration), so it never holds the cluster CA private key.
# It authenticates with a credential provisioned by the Talos "Kubernetes Talos
# API access" feature.
#
# Prerequisite on the Talos nodes (machine config):
#
#   machine:
#     features:
#       kubernetesTalosAPIAccess:
#         enabled: true
#         allowedRoles:
#           - os:admin
#         allowedKubernetesNamespaces:
#           - <release namespace>
talos:
  apiAccess:
    # When true, the chart creates a serviceaccounts.talos.dev resource so Talos
    # provisions a short-lived API credential into a Secret, mounted into the pod.
    enabled: true

    # Roles granted to the server's own credential. The certificates the server
    # can issue are bounded by these roles — Talos rejects privilege escalation.
    # Must be a subset of allowedRoles in the machine config and a superset of
    # config.roles.
    roles:
      - os:admin

  # Mount path for the provisioned talosconfig. The server reads it via
  # TALOSCTL_OIDC_TALOS_CONFIG (<configMountPath>/config).
  configMountPath: /var/run/secrets/talos.dev

  # Use an existing talosconfig Secret (must contain a "config" key) instead of
  # having the chart create a serviceaccounts.talos.dev resource. When set,
  # apiAccess.enabled is ignored.
  existingCredentialSecret: ""
